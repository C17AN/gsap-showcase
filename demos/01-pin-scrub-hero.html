<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · Pin + Scrub Hero</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .hero { height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero-stack { text-align: center; }
  .hero-stack h1 { color: var(--accent); }
  .pin-wrap { height: 300vh; }       /* pin 구간 길이 = scrub 거리 */
  .filler { background: #111; }
  .filler:nth-child(even){ background:#161616; }
</style>
</head>
<body>
<div class="label">01 · <b>Pin + Scrub Hero</b> — BlueGarage 히어로 패턴</div>
<a class="back" href="../index.html">← INDEX</a>

<div class="pin-wrap">
  <div class="hero">
    <div class="hero-stack">
      <h1 class="big" data-line>ENTERTAINMENT</h1>
      <h1 class="big" data-line>MEETS TECHNOLOGY</h1>
      <h1 class="huge" id="brand">BLUE GARAGE</h1>
    </div>
  </div>
</div>

<section class="section filler"><h2 class="big">다음 섹션</h2></section>
<section class="section filler"><p class="muted">스크롤하면 히어로가 고정된 채 텍스트가 위로 밀려 올라갑니다.</p></section>

<div class="hint">SCROLL ↓</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* 핵심: pin-wrap 동안 hero를 화면에 고정(pin)하고,
   스크롤 진행도(scrub)에 맞춰 텍스트를 translateY 시킨다. */
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: ".pin-wrap",
    start: "top top",
    end: "bottom bottom",
    pin: ".hero",      // .hero를 viewport에 고정
    scrub: true,       // 스크롤 위치에 타임라인을 직접 바인딩
  }
});

tl.to("[data-line]", { yPercent: -120, opacity: 0, stagger: 0.1, ease: "none" })
  .from("#brand", { yPercent: 60, scale: 0.6, opacity: 0, ease: "none" }, "<")
  .to("#brand", { scale: 1.1, ease: "none" });
</script>
</body>
</html>
