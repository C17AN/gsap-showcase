<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 · Split Text (char stagger)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .stack { max-width: 1100px; }
  .stack h2 { font-size: clamp(2.2rem,6vw,5rem); }
  .char { display: inline-block; will-change: transform; }
</style>
</head>
<body>
<div class="label">08 · <b>Split Text</b> — 글자 단위 stagger (무료 분할 구현)</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<section class="section">
  <div class="stack">
    <h2 class="split">글자 하나하나가</h2>
    <h2 class="split accent">차례대로 떠오른다</h2>
  </div>
</section>

<section class="section"><p class="muted">유료 SplitText 플러그인 없이, 글자를 span으로 쪼개 stagger를 줍니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* 무료 글자 분할: 텍스트를 글자별 <span class="char">로 재구성.
   (공백은 &nbsp; 처리해 줄바꿈 유지) */
document.querySelectorAll(".split").forEach((el) => {
  const chars = [...el.textContent].map((ch) =>
    `<span class="char">${ch === " " ? "&nbsp;" : ch}</span>`
  ).join("");
  el.innerHTML = chars;

  gsap.from(el.querySelectorAll(".char"), {
    yPercent: 120,
    opacity: 0,
    rotateX: -90,
    transformOrigin: "0% 50% -20px",
    stagger: 0.03,
    duration: 0.8,
    ease: "back.out(1.7)",
    scrollTrigger: { trigger: el, start: "top 80%", toggleActions: "play none none reverse" }
  });
});
</script>
</body>
</html>
