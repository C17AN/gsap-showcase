<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 · Scroll Progress Indicator</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .bar { position: fixed; top: 0; left: 0; height: 4px; width: 100%;
         transform-origin: left center; transform: scaleX(0);
         background: var(--accent); z-index: 1000; }
  .ring { position: fixed; bottom: 28px; right: 28px; z-index: 1000; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bgc { stroke: rgba(255,255,255,.15); }
  .ring .fgc { stroke: var(--accent); stroke-dasharray: 251.2; stroke-dashoffset: 251.2; }
  .ring span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; }
</style>
</head>
<body>
<div class="bar"></div>
<div class="ring">
  <svg width="84" height="84"><circle class="bgc" cx="42" cy="42" r="40"/><circle class="fgc" cx="42" cy="42" r="40"/></svg>
  <span id="pct">0%</span>
</div>

<div class="label">07 · <b>Scroll Progress</b> — 상단 바 + 원형 인디케이터</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big">스크롤 진행도</h2></section>
<section class="section"><h2 class="big accent">읽기 진행률 표시</h2></section>
<section class="section"><h2 class="big">블로그·아티클 단골</h2></section>
<section class="section"><h2 class="big muted">끝</h2></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const C = 2 * Math.PI * 40;  // 원 둘레
const ring = document.querySelector(".fgc");
const pct = document.getElementById("pct");

/* 페이지 전체 스크롤 진행도(0~1)를 바의 scaleX와 원의 dashoffset에 매핑 */
ScrollTrigger.create({
  start: 0,
  end: "max",
  onUpdate: (self) => {
    const p = self.progress;
    gsap.set(".bar", { scaleX: p });
    ring.style.strokeDashoffset = C * (1 - p);
    pct.textContent = Math.round(p * 100) + "%";
  }
});
</script>
</body>
</html>
