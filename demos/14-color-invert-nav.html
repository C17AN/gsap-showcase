<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 · Header Color Invert</title>
<link rel="stylesheet" href="_shared.css">
<style>
  header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
           display: flex; justify-content: space-between; align-items: center;
           padding: 18px 30px; mix-blend-mode: normal; transition: color .4s; color:#fff; }
  header .logo { font-weight: 900; letter-spacing: -.03em; }
  header nav a { color: inherit; text-decoration: none; margin-left: 22px; font-size: 13px; letter-spacing:.1em; }
  section[data-theme] h2 { font-size: clamp(2.5rem,7vw,6rem); }
  .dark  { background:#0d0d0d; color:#fff; }
  .light { background:#f2f2f2; color:#111; }
  .blue  { background:var(--accent); color:#08263a; }
</style>
</head>
<body>
<header><div class="logo">BLUE GARAGE</div><nav><a>COMPANY</a><a>PRODUCT</a><a>CONTACT</a></nav></header>

<div class="label">14 · <b>Header Color Invert</b> — 섹션 배경에 맞춰 헤더 색 자동 전환</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section dark"  data-theme="#fff"><h2>DARK</h2></section>
<section class="section light" data-theme="#111"><h2>LIGHT</h2></section>
<section class="section blue"  data-theme="#08263a"><h2>BLUE</h2></section>
<section class="section dark"  data-theme="#fff"><h2>DARK AGAIN</h2></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const header = document.querySelector("header");

/* 각 섹션이 헤더 영역(top: 0~10%)에 닿을 때 헤더 글자색을 그 섹션의 data-theme로 전환.
   BlueGarage가 파란 Engineering 섹션 위에서 헤더 톤을 바꾸는 것과 동일 원리. */
gsap.utils.toArray("section[data-theme]").forEach((sec) => {
  ScrollTrigger.create({
    trigger: sec,
    start: "top 10%",
    end: "bottom 10%",
    onToggle: (self) => {
      if (self.isActive) gsap.to(header, { color: sec.dataset.theme, duration: 0.4 });
    }
  });
});
</script>
</body>
</html>
