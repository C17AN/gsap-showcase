<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 · Parallax Layers</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .stage { position: relative; height: 100vh; overflow: hidden;
           display:flex; align-items:center; justify-content:center; }
  .layer { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; }
  .bg   { font-size: clamp(8rem,28vw,28rem); color:#171717; font-weight:900; }
  .mid  { font-size: clamp(5rem,16vw,16rem); color:var(--accent); opacity:.85; }
  .fg   { font-size: clamp(2rem,5vw,4rem); color:#fff; }
</style>
</head>
<body>
<div class="label">05 · <b>Parallax Layers</b> — 깊이감(레이어별 속도차)</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<div class="stage">
  <div class="layer bg"  data-speed="0.2">2025</div>
  <div class="layer mid" data-speed="0.6">PARALLAX</div>
  <div class="layer fg"  data-speed="1.4">레이어마다 다른 속도</div>
</div>

<section class="section"><p class="muted">data-speed 값이 클수록 빠르게 움직여 가까운 레이어처럼 보입니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* 각 레이어를 스크롤 진행 동안 yPercent로 이동시키되 속도를 다르게 → 시차(parallax) */
gsap.utils.toArray(".layer").forEach((layer) => {
  const speed = parseFloat(layer.dataset.speed);
  gsap.to(layer, {
    yPercent: -30 * speed,
    ease: "none",
    scrollTrigger: {
      trigger: ".stage",
      start: "top bottom",
      end: "bottom top",
      scrub: true,
    }
  });
});
</script>
</body>
</html>
