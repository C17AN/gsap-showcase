<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 · Image Parallax Grid</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4vw; padding: 12vh 6vw; max-width: 1200px; margin: 0 auto; }
  .cell { overflow: hidden; border-radius: 8px; aspect-ratio: 3/4; }
  .cell:nth-child(even){ margin-top: 14vh; }   /* 엇갈린 배치 */
  .cell img { width: 100%; height: 120%; object-fit: cover; display:block; }
</style>
</head>
<body>
<div class="label">12 · <b>Image Parallax Grid</b> — 갤러리 그리드 시차 스크롤</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<div class="grid" id="grid"></div>

<section class="section"><p class="muted">이미지를 컨테이너보다 크게(120%) 두고 yPercent로 안에서 흐르게 합니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const grid = document.getElementById("grid");
for (let i = 1; i <= 6; i++) {
  grid.insertAdjacentHTML("beforeend",
    `<div class="cell"><img src="https://picsum.photos/seed/g${i}/600/800" alt=""></div>`);
}

/* 각 셀의 이미지를 셀 안에서 위로 흘려 시차 효과. 셀마다 독립 ScrollTrigger */
gsap.utils.toArray(".cell img").forEach((img) => {
  gsap.fromTo(img, { yPercent: -10 }, {
    yPercent: 10, ease: "none",
    scrollTrigger: { trigger: img.parentElement, start: "top bottom", end: "bottom top", scrub: true }
  });
});
</script>
</body>
</html>
