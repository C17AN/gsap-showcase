<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 · ScrollTrigger.batch grid</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
          gap: 20px; padding: 12vh 6vw; max-width: 1300px; margin: 0 auto; }
  .card { aspect-ratio: 3/4; border-radius: 10px; background:#1a1a1a; border:1px solid var(--line);
          display:flex; align-items:flex-end; padding:16px; opacity:0; }
  .card span { font-weight:800; }
</style>
</head>
<body>
<div class="label">18 · <b>ScrollTrigger.batch()</b> — 그리드 항목을 보이는 만큼 묶어서 stagger</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<div class="grid" id="grid"></div>

<section class="section"><p class="muted">batch()는 한 화면에 동시에 들어온 요소들을 자동으로 묶어 하나의 stagger로 처리 — 카드 수백 개도 ScrollTrigger 하나로.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const grid = document.getElementById("grid");
for (let i = 1; i <= 24; i++) {
  grid.insertAdjacentHTML("beforeend", `<div class="card"><span>${String(i).padStart(2,"0")}</span></div>`);
}
gsap.set(".card", { y: 60 });

/* batch: 뷰포트에 함께 진입한 요소들을 한 묶음으로 잡아 stagger 등장.
   요소마다 ScrollTrigger를 만들지 않아 성능에 유리 (대형 그리드/리스트용). */
ScrollTrigger.batch(".card", {
  start: "top 90%",
  onEnter: (batch) => gsap.to(batch, { opacity: 1, y: 0, stagger: 0.08, duration: 0.6, ease: "power3.out", overwrite: true }),
  onLeaveBack: (batch) => gsap.to(batch, { opacity: 0, y: 60, stagger: 0.05, overwrite: true }),
});
</script>
</body>
</html>
