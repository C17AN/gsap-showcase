<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 · Horizontal Scroll</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .h-wrap { overflow: hidden; }
  .track { display: flex; width: max-content; height: 100vh; }
  .panel { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .panel:nth-child(1){ background:#0d0d0d; }
  .panel:nth-child(2){ background:#1ea7ff; color:#0d0d0d; }
  .panel:nth-child(3){ background:#161616; }
  .panel:nth-child(4){ background:#f2f2f2; color:#0d0d0d; }
  .panel h2 { font-size: clamp(3rem,9vw,9rem); }
</style>
</head>
<body>
<div class="label">04 · <b>Horizontal Scroll</b> — 세로 스크롤 → 가로 이동 (갤러리 패턴)</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<div class="h-wrap">
  <div class="track">
    <div class="panel"><h2>01</h2></div>
    <div class="panel"><h2>02</h2></div>
    <div class="panel"><h2>03</h2></div>
    <div class="panel"><h2>04</h2></div>
  </div>
</div>

<section class="section"><p class="muted">가로 스크롤이 끝나면 다시 세로로 이어집니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const track = document.querySelector(".track");
const panels = gsap.utils.toArray(".panel");

/* 트랙을 pin 하고, 세로 스크롤량을 트랙의 가로 이동(xPercent)으로 변환.
   end 거리 = 패널 개수만큼의 화면 너비 */
gsap.to(track, {
  xPercent: -100 * (panels.length - 1),
  ease: "none",
  scrollTrigger: {
    trigger: ".h-wrap",
    pin: true,
    scrub: 1,
    end: () => "+=" + track.offsetWidth,
  }
});
</script>
</body>
</html>
