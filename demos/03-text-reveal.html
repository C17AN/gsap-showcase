<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · Text Reveal (mask up)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .reveal-line { overflow: hidden; }            /* 마스크 */
  .reveal-line > span { display: inline-block; will-change: transform; }
  .stack h2 { font-size: clamp(2rem,6vw,5rem); }
  .stack { max-width: 1000px; }
</style>
</head>
<body>
<div class="label">03 · <b>Text Reveal</b> — 라인 마스크 업 (Awwwards 단골)</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="muted big">스크롤 ↓</h2></section>

<section class="section">
  <div class="stack">
    <h2><span class="reveal-line"><span>크리에이티브는</span></span></h2>
    <h2><span class="reveal-line"><span>한 줄씩</span></span></h2>
    <h2 class="accent"><span class="reveal-line"><span>마스크 뒤에서 솟아오른다</span></span></h2>
  </div>
</section>

<section class="section">
  <p class="muted stack">한 번 등장한 뒤 되돌아가지 않게 하려면 toggleActions의 마지막 두 값을 "none none"으로 둔다.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* 각 라인을 마스크(overflow hidden) 안에서 yPercent 100 -> 0 으로 끌어올림.
   SplitText 없이 라인 단위로 깔끔하게 reveal 하는 가장 흔한 방법. */
gsap.utils.toArray(".reveal-line > span").forEach((line) => {
  gsap.from(line, {
    yPercent: 110,
    duration: 1,
    ease: "power4.out",
    scrollTrigger: {
      trigger: line,
      start: "top 85%",
      toggleActions: "play none none reverse",
    }
  });
});
</script>
</body>
</html>
