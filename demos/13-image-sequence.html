<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13 · Canvas Image Sequence</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .pin-wrap { height: 500vh; }   /* 스크롤 길이 = 프레임 수에 비례 */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background:#000; }
  .seq-caption { position: fixed; bottom: 8vh; width: 100%; text-align: center; z-index: 5; }
</style>
</head>
<body>
<div class="label">13 · <b>Image Sequence</b> — 스크롤로 프레임 재생 (Apple AirPods 식)</div>
<a class="back" href="../index.html">← INDEX</a>

<div class="pin-wrap">
  <canvas id="c" width="800" height="500"></canvas>
  <div class="seq-caption"><h2 class="big" id="frameText">FRAME 0</h2></div>
</div>

<section class="section"><p class="muted">실서비스는 미리 렌더한 PNG 시퀀스를 쓰지만, 여기선 캔버스로 프레임을 즉석 생성해 원리를 보여줍니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const FRAMES = 120;
const state = { frame: 0 };
const frameText = document.getElementById("frameText");

/* 실제로는 image[] 배열을 preload 후 drawImage 하지만,
   여기선 프레임 번호로 회전하는 도형을 그려 시퀀스 재생 원리를 시연. */
function render() {
  const f = Math.round(state.frame);
  const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2;
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
  const ang = (f / FRAMES) * Math.PI * 2;
  for (let i = 0; i < 12; i++) {
    const a = ang + (i / 12) * Math.PI * 2;
    const r = 60 + (f/FRAMES) * 150;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 14, 0, Math.PI*2);
    ctx.fillStyle = `hsl(${200 + i*8} 90% ${50 + (f/FRAMES)*20}%)`;
    ctx.fill();
  }
  frameText.textContent = "FRAME " + f;
}
render();

/* 스크롤 진행도를 frame 인덱스(0→119)로 scrub. 캔버스를 pin해 고정 재생. */
gsap.to(state, {
  frame: FRAMES - 1,
  ease: "none",
  onUpdate: render,
  scrollTrigger: { trigger: ".pin-wrap", start: "top top", end: "bottom bottom", pin: "canvas", scrub: 0.5 }
});
</script>
</body>
</html>
