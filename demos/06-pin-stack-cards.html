<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 · Pinned Stacking Cards</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .cards { padding: 10vh 0; }
  .card {
    position: sticky; top: 12vh;
    height: 70vh; margin: 0 auto 6vh; max-width: 900px;
    border-radius: 20px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .card:nth-child(1){ background:#1ea7ff; color:#08263a; }
  .card:nth-child(2){ background:#f25f5c; }
  .card:nth-child(3){ background:#ffe066; color:#222; }
  .card:nth-child(4){ background:#2a2a2a; }
  .card h2 { font-size: clamp(2.5rem,7vw,6rem); }
</style>
</head>
<body>
<div class="label">06 · <b>Pinned Stacking Cards</b> — 카드가 쌓이며 축소 (커머스/포트폴리오)</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤 ↓</h2></section>

<div class="cards">
  <div class="card"><h2>CARD 01</h2></div>
  <div class="card"><h2>CARD 02</h2></div>
  <div class="card"><h2>CARD 03</h2></div>
  <div class="card"><h2>CARD 04</h2></div>
</div>

<section class="section"><p class="muted">sticky로 쌓고, 뒤 카드가 들어올 때 앞 카드를 살짝 축소시켜 입체감을 줍니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

/* CSS sticky로 카드를 겹쳐 쌓고, 다음 카드가 다가오는 동안 현재 카드를 scale 다운.
   sticky + GSAP scrub 조합 = 가장 가벼운 스택 카드 구현. */
const cards = gsap.utils.toArray(".card");
cards.forEach((card, i) => {
  if (i === cards.length - 1) return;
  gsap.to(card, {
    scale: 0.88, filter: "brightness(0.6)", ease: "none",
    scrollTrigger: {
      trigger: cards[i + 1],
      start: "top bottom",
      end: "top top",
      scrub: true,
    }
  });
});
</script>
</body>
</html>
