<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 · Word Fill on Scroll</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .pin-wrap { height: 250vh; }
  .copy { max-width: 1100px; font-size: clamp(1.6rem,4.5vw,3.4rem); font-weight: 800; line-height: 1.25; }
  .word { color: rgba(255,255,255,.18); transition: color .1s; }  /* 기본 흐릿 */
</style>
</head>
<body>
<div class="label">10 · <b>Word Fill</b> — 스크롤하며 단어가 차오름 (선언문 패턴)</div>
<a class="back" href="../index.html">← INDEX</a>

<div class="pin-wrap">
  <section class="section">
    <p class="copy" id="copy">우리는 기술과 엔터테인먼트를 결합하여 새로운 형태의 즐거움을 만든다. 한 단어씩, 스크롤을 따라, 또렷하게 차오른다.</p>
  </section>
</div>

<section class="section"><p class="muted">단어를 span으로 쪼개고 스크롤 진행도에 따라 순차적으로 색을 채웁니다.</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const copy = document.getElementById("copy");
copy.innerHTML = copy.textContent.split(" ")
  .map((w) => `<span class="word">${w}</span>`).join(" ");

/* 섹션을 pin 하고, scrub 타임라인으로 단어 색을 stagger 채움 */
gsap.to(".word", {
  color: "#ffffff",
  stagger: 1,           // 단어 간 균등 분배
  ease: "none",
  scrollTrigger: {
    trigger: ".pin-wrap",
    start: "top top",
    end: "bottom bottom",
    pin: ".section",
    scrub: true,
  }
});
</script>
</body>
</html>
