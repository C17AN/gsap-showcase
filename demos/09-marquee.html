<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 · Marquee (scroll-velocity)</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .marquee { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--line); padding: 1.5rem 0; }
  .marquee.alt { background: var(--accent); color:#08263a; }
  .row { display: inline-flex; }
  .row span { font-size: clamp(2rem,6vw,5rem); font-weight: 800; text-transform: uppercase; padding: 0 2rem; }
</style>
</head>
<body>
<div class="label">09 · <b>Marquee</b> — 무한 흐름 + 스크롤 속도에 반응</div>
<a class="back" href="../index.html">← INDEX</a>

<section class="section"><h2 class="big muted">스크롤하면 방향/속도가 바뀝니다 ↓</h2></section>

<div class="marquee" data-dir="1"><div class="row"></div></div>
<div class="marquee alt" data-dir="-1"><div class="row"></div></div>

<section class="section" style="height:60vh"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const WORDS = "BLUE GARAGE • ENTERTAINMENT • TECHNOLOGY • ";
document.querySelectorAll(".marquee").forEach((m) => {
  const row = m.querySelector(".row");
  const text = WORDS.repeat(6);
  row.innerHTML = `<span>${text}</span><span>${text}</span>`; // 2벌 복제로 무한 루프

  const dir = parseFloat(m.dataset.dir);
  /* 기본 자동 흐름 (xPercent -50 한 바퀴) */
  const loop = gsap.to(row, { xPercent: -50 * dir, ease: "none", duration: 18, repeat: -1 });

  /* 스크롤 속도/방향에 따라 timeScale을 조절 → 살아있는 느낌 */
  ScrollTrigger.create({
    onUpdate: (self) => {
      const v = Math.min(Math.abs(self.getVelocity()) / 300, 6);
      loop.timeScale(self.direction * (1 + v) * dir);
    }
  });
});
</script>
</body>
</html>
